name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: 'starter/frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get backend LoadBalancer URL
        id: backend-url
        run: |
          for i in {1..30}; do
            BACKEND_URL=$(kubectl get service backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$BACKEND_URL" ]; then
              echo "url=http://$BACKEND_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for backend LoadBalancer..."
            sleep 20
          done
          echo "Backend LoadBalancer URL was not available."
          exit 1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: starter/frontend
          push: true
          tags: 204824863790.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}
          build-args: |
            REACT_APP_MOVIE_API_URL=${{ steps.backend-url.outputs.url }}

      - name: Update Kubernetes image
        run: |
          cd starter/frontend/k8s
          kubectl kustomize edit set image frontend=204824863790.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

      - name: Deploy frontend to EKS
        run: |
          kubectl apply -k starter/frontend/k8s